name: Mails des recruteurs
on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # toutes les 15 minutes
  workflow_dispatch: {}
concurrency: { group: mails, cancel-in-progress: false }
jobs:
  mails:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Y a-t-il de nouveaux mails ?
        id: new
        run: |
          SINCE=$(date -u -d '-20 minutes' +%Y-%m-%dT%H:%M:%SZ)
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && SINCE=$(date -u -d '-3 days' +%Y-%m-%dT%H:%M:%SZ)
          N=$(curl -s "https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/mails?select=id&created_at=gte.$SINCE" -H "apikey: $SUPABASE_SECRET_KEY" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "Nouveaux mails transmis par Gmail : $N"
          echo "n=$N" >> "$GITHUB_OUTPUT"
      - if: steps.new.outputs.n != '0'
        uses: actions/checkout@v5
      - if: steps.new.outputs.n != '0'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.new.outputs.n != '0'
        name: Relier les mails aux candidatures (l'app ouverte en arrière-plan)
        run: |
          pip install -q playwright requests
          python -m playwright install --with-deps chromium > /dev/null
          python search/app_run.py mail
