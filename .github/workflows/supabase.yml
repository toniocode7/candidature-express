name: Mettre à jour Supabase (base et fonctions)
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Lier le projet
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Appliquer la structure de la base
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Déployer les fonctions serveur
        run: |
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            supabase functions deploy --project-ref "$PROJECT_REF"
          else echo "Aucune fonction pour l'instant."; fi
