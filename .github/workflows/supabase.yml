name: Mettre à jour Supabase (base et fonctions)
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Lier le projet
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Appliquer la structure de la base
        run: supabase db push --remote --include-all --yes || supabase db push --linked --include-all --yes
      - name: Ranger les clés des fonctions dans Supabase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CE_SERVICE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          args=()
          for v in GEMINI_API_KEY GROQ_API_KEY CE_SERVICE_KEY CE_PUBLISHABLE_KEY; do
            if [ -n "${!v}" ]; then args+=("$v=${!v}"); echo "$v : présent"; else echo "$v : absent"; fi
          done
          supabase secrets set --project-ref "$PROJECT_REF" --yes "${args[@]}" >/dev/null
      - name: Déployer les fonctions serveur
        run: |
          for f in supabase/functions/*/; do
            n=$(basename "$f"); [ "$n" = "_shared" ] && continue
            supabase functions deploy "$n" --no-verify-jwt --project-ref "$PROJECT_REF" --yes
          done
