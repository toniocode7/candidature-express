name: Recherche d'offres automatique
on:
  schedule:
    # Secours seulement : l'horloge de Supabase lance la recherche à 0 h, 6 h, 12 h et 18 h (heure de Paris).
    # GitHub saute souvent ses tâches programmées ; celle-ci ne fait rien si une recherche a eu lieu il y a moins de 2 h.
    - cron: "40 4,5,10,11,16,17,22,23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Interroger toutes les sources maintenant"
        type: boolean
        default: true
      only:
        description: "Sources à interroger seulement (ex. linkedin,indeed), vide = toutes"
        required: false
        default: ""
concurrency: { group: recherche, cancel-in-progress: false }
jobs:
  verif:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.v.outputs.go }}
    steps:
      - id: v
        name: Une recherche a-t-elle déjà eu lieu récemment ?
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          AT=$(curl -s "https://$REF.supabase.co/rest/v1/docs?select=data&col=eq.ce&id=eq.sources" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); s=d[0]['data'] if d else {}; print(max((s.get('_run') or {}).get('at') or 0, s.get('_asked') or 0))")
          AGE=$(( ( $(date +%s) * 1000 - AT ) / 60000 ))
          echo "Dernière recherche il y a $AGE min"
          if [ "$AGE" -lt 120 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "Déjà faite : rien à faire."; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
  recherche:
    needs: verif
    if: needs.verif.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: search/requirements.txt }
      - name: Installer les outils (JobSpy, navigateur)
        run: |
          pip install -q -r search/requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
      - name: Récolter les offres sur chaque source
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only=${{ inputs.only }}"; fi
          python search/harvest.py $ARGS
      - name: Trier les offres avec tes règles (l'app ouverte en arrière-plan)
        run: python search/app_run.py search
