name: Diagnostic complet
# Un seul bouton pour tout vérifier : base, IA, lecture d'annonces, notifications.
# Rien de personnel n'est affiché (comptes et états seulement).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Adresse d'une annonce à lire (facultatif)"
        required: false
        default: ""
      notif:
        description: "Envoyer une notification de test sur tes appareils"
        type: boolean
        default: true
jobs:
  base:
    name: Base de données
    runs-on: ubuntu-latest
    steps:
      - name: Compter les données enregistrées (sans rien afficher de personnel)
        env:
          URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -e
          q() { curl -sf "$URL/rest/v1/docs?select=id&col=eq.$1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Prefer: count=exact" -H "Range: 0-0" -D - -o /dev/null | grep -i content-range | sed 's/.*\///' | tr -d '\r'; }
          echo "Documents de l'app : $(q app)"
          echo "Réglages privés    : $(q ce)"
          curl -sf "$URL/rest/v1/docs?select=id&col=eq.app&id=like.o_*" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | python3 -c "import json,sys; print('Candidatures :', len(json.load(sys.stdin)))"
          echo "Inscriptions fermées : $(curl -s "$URL/auth/v1/settings" -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" | python3 -c 'import json,sys; print("oui" if json.load(sys.stdin).get("disable_signup") else "NON, à fermer")')"
          echo "Journal des erreurs de l'app (7 jours) : $(curl -sf "$URL/rest/v1/app_errors?select=n&last=gte.$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | python3 -c 'import json,sys; e=json.load(sys.stdin); print(len(e), "erreur(s) différente(s),", sum(x["n"] for x in e), "au total")')"
          echo "Vitesse d'ouverture (7 jours) : $(curl -sf "$URL/rest/v1/app_perf?select=dev,n,open_sum&day=gte.$(date -u -d '7 days ago' +%Y-%m-%d)" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | python3 -c 'import json,sys; r=json.load(sys.stdin); d={}
          for x in r: a=d.setdefault(x["dev"],[0,0]); a[0]+=x["n"]; a[1]+=x["open_sum"]
          print(" · ".join(f"{k} {v[1]/v[0]/1000:.1f} s ({v[0]} ouvertures)" for k,v in d.items()) or "pas encore de mesure")')"
          echo "Carnet des recruteurs : $(curl -sf -X POST "$URL/rest/v1/rpc/ce_contacts" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}' | python3 -c 'import json,sys; r=json.load(sys.stdin); print(len(r), "personne(s),", sum(1 for x in r if x.get("tel")), "avec téléphone")')"
          curl -s -o /dev/null -w "Écriture d'une erreur sans connexion (doit être refusée) : HTTP %{http_code}\n" -X POST "$URL/rest/v1/rpc/ce_log_error" -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" -H "Content-Type: application/json" -d '{"p_msg":"test","p_src":"","p_ver":"","p_ctx":""}'
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/docs?select=id" -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}")
          echo "Lecture sans connexion (doit être vide ou refusée) : HTTP $code, $(curl -s "$URL/rest/v1/docs?select=id" -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" | head -c 80)"
  ia:
    name: IA et lecture d'annonces
    runs-on: ubuntu-latest
    env:
      FN: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1
      KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      URL_IN: ${{ github.event.inputs.url }}
    steps:
      - name: Modèles disponibles
        run: |
          curl -s -X POST "$FN/ai" -H "x-ce-key: $KEY" -H "Content-Type: application/json" -d '{"ping":true}' | python3 -m json.tool
      - name: Refus sans connexion (doit répondre 401)
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -X POST "$FN/ai" -H "Content-Type: application/json" -d '{"prompt":"test"}'
      - name: Question simple en JSON (modèle léger)
        run: |
          curl -s -X POST "$FN/ai" -H "x-ce-key: $KEY" -H "Content-Type: application/json" \
            -d '{"mode":"json","tier":"light","prompt":"Réponds en JSON avec les clés ville (préfecture du Finistère) et habitants (nombre approximatif)."}' | python3 -m json.tool
      - name: Rédaction (modèle de qualité)
        run: |
          curl -s -X POST "$FN/ai" -H "x-ce-key: $KEY" -H "Content-Type: application/json" \
            -d '{"mode":"text","tier":"quality","debug":true,"prompt":"En deux phrases, dans un français posé et naturel, sans tiret long, explique ce que fait un assistant approvisionnement."}' | python3 -m json.tool
      - name: Analyse longue (comme dans l'app)
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, os
          offre = ("Assistant approvisionnement H/F. Entreprise industrielle à Brest. Missions : passer les commandes fournisseurs dans SAP, suivre les livraisons, "
                   "gérer les stocks, relancer les fournisseurs, mettre à jour les tableaux de bord Excel, travailler avec la production et la logistique. "
                   "Profil : bac+3 à bac+5 en supply chain ou achats, première expérience appréciée, anglais professionnel, rigueur. CDI, 32-36 k€. ") * 25
          cv = ("Master supply chain et achats. Assistant logistique en entreprise industrielle : suivi des flux, SAP, tableaux de bord Excel. "
                "Transport et import-export : documents douaniers, transitaires. Anglais C1. ") * 20
          prompt = ("Tu analyses une offre d'emploi classique face au CV du candidat. Tutoie-le. Réponds en JSON seulement : "
                    '{"score":0,"criteres":[{"nom":"","note":0,"commentaire":""}],"points_forts":[""],"points_faibles":[""],"motscles":[""],"verdict":"","conseil":"","salaire":{"avis":"","fourchette":""}}'
                    "\n\nCV :\n" + cv + "\n\nANNONCE :\n" + offre)
          print(len(prompt), "caractères envoyés")
          t = time.time()
          req = urllib.request.Request(os.environ["FN"] + "/ai", data=json.dumps({"mode": "json", "tier": "quality", "debug": True, "prompt": prompt}).encode(),
                                       headers={"x-ce-key": os.environ["KEY"], "Content-Type": "application/json"})
          try:
              r = urllib.request.urlopen(req, timeout=160); j = json.load(r)
          except urllib.error.HTTPError as e:
              j = json.load(e)
          print(f"Durée : {time.time() - t:.0f} s")
          print("Modèle :", j.get("model"), "| erreur :", j.get("error"), "| détail :", str(j.get("detail"))[:900])
          if j.get("json"): print("Note obtenue :", j["json"].get("score"))
          PY
      - name: Recherche web (infos entreprise pour les lettres)
        run: |
          curl -s -X POST "$FN/read" -H "x-ce-key: $KEY" -H "Content-Type: application/json" \
            -d '{"search":"Naval Group Brest entreprise activité"}' | python3 -c "import json,sys; w=json.load(sys.stdin).get('web',[]); print(len(w),'résultats'); [print('-',x['title'],'|',x['description'][:120]) for x in w[:4]]"
      - name: Compteur du jour (modèles épuisés)
        env:
          URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
        run: |
          curl -s "$URL/rest/v1/usage?select=provider,model,ok,fail,exhausted&order=provider" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | python3 -m json.tool
      - name: Textes complets gardés pour l'analyse (par source)
        env:
          URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
        run: |
          for src in indeed linkedin hellowork francetravail meteojob carrieres; do
            n=$(curl -s -o /dev/null -D - "$URL/rest/v1/raw_offers?select=id&source=eq.$src&full_text=not.is.null" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Prefer: count=exact" -H "Range: 0-0" | grep -i content-range | tr -d '\r')
            echo "$src : $n"
          done
      - name: Sauvegarde pour Google Drive (taille seulement)
        env:
          MK: ${{ secrets.CE_MAIL_KEY }}
        run: |
          curl -s -X POST "$FN/mailin" -H "x-ce-mail-key: $MK" -H "Content-Type: application/json" -d '{"action":"backup"}' > b.json
          python3 -c "import json; d=json.load(open('b.json')); print('Erreur :', d.get('error'), d.get('detail')) if 'error' in d else print('Sauvegarde OK :', len(d['docs']), 'éléments,', d['candidatures'], 'candidatures,', round(len(open('b.json').read())/1e6, 2), 'Mo')"
          rm -f b.json
      - name: Lecture d'une vraie annonce
        run: |
          U="$URL_IN"
          if [ -z "$U" ]; then
            id=$(curl -s -A "Mozilla/5.0" "https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search?keywords=supply%20chain&location=Bretagne&start=0" | grep -oE 'jobs/view/[^"?]*-[0-9]{8,}' | head -1 | grep -oE '[0-9]{8,}$')
            U="https://www.linkedin.com/jobs/view/$id"
          fi
          echo "Annonce : $U"
          curl -s -X POST "$FN/read" -H "x-ce-key: $KEY" -H "Content-Type: application/json" -d "{\"url\":\"$U\"}" > r.json
          python3 - <<'PY'
          import json
          j = json.load(open("r.json"))
          print("Statut :", j.get("statusCode"), "| lu par :", j.get("via"), "| bloqué :", j.get("blocked"))
          print("Titre :", j.get("title"))
          print(len(j.get("markdown", "")), "caractères lus")
          print("---")
          print(j.get("markdown", "")[:700])
          PY
  notifs:
    name: Notifications et calendrier
    runs-on: ubuntu-latest
    env:
      FN: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1
      KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Clé publique des notifications (créée au premier appel)
        run: |
          curl -s -X POST "$FN/push" -H "Content-Type: application/json" -d '{"action":"vapid"}' | python3 -c "import json,sys; k=json.load(sys.stdin)['publicKey']; print('Clé publique :', k[:12]+'…', len(k), 'caractères')"
      - name: Envoi sans autorisation (doit être refusé)
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -X POST "$FN/push" -H "Content-Type: application/json" -d '{"action":"test"}'
      - name: Notification de test vers les appareils abonnés
        if: ${{ github.event.inputs.notif != 'false' }}
        run: |
          curl -s -X POST "$FN/push" -H "x-ce-key: $KEY" -H "Content-Type: application/json" -d '{"action":"test"}'; echo
      - name: Calendrier avec un mauvais jeton (doit être refusé)
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "$FN/ics?k=faux"
  voix:
    name: Voix (simulation d'entretien)
    runs-on: ubuntu-latest
    env:
      FN: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1
      KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Transcription de la voix (simulation d'entretien)
        run: |
          sudo apt-get install -y -qq espeak-ng > /dev/null 2>&1 || true
          espeak-ng -v fr -s 150 -w voix.wav "Bonjour, je suis assistant logistique depuis deux ans et je gère les commandes fournisseurs."
          python3 - <<'PY2'
          import base64, json, os, time, urllib.request
          data = base64.b64encode(open("voix.wav", "rb").read()).decode()
          t = time.time()
          req = urllib.request.Request(os.environ["FN"] + "/ai", data=json.dumps({"transcribe": {"mime": "audio/wav", "data": data}}).encode(),
                                       headers={"x-ce-key": os.environ["KEY"], "Content-Type": "application/json"})
          try:
              j = json.load(urllib.request.urlopen(req, timeout=60))
          except urllib.error.HTTPError as e:
              j = json.load(e)
          print(f"Durée : {time.time() - t:.1f} s | service : {j.get('via')} | erreur : {j.get('error')} {str(j.get('detail') or '')[:300]}")
          print("Texte compris :", j.get("text"))
          PY2
