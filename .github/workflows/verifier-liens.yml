name: Vérifier les liens des offres suggérées
on:
  workflow_dispatch:
    inputs:
      reparer:
        description: "Retirer les suggestions dont le lien ne correspond pas et les retrier"
        type: boolean
        default: false
jobs:
  liens:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -q requests
          if [ "${{ inputs.reparer }}" = "true" ]; then python search/fix_suggestions.py; fi
          python search/check_links.py
